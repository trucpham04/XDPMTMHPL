spring.application.name=messages_service
server.port=8084

# Database configuration

# spring.datasource.url=jdbc:mysql://message-db:3306/message_service
spring.datasource.url=jdbc:mysql://localhost:3307/message_service
spring.datasource.username=message_service
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka client config (if using service discovery)
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# eureka.instance.preferIpAddress=true

# Feign client config
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# Logging
logging.level.com.chat=DEBUG
