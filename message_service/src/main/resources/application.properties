spring.application.name=messages_service
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.message=message_service.queue

server.port=8084

# Database configuration

spring.datasource.url=jdbc:mysql://message_db:3306/message_service
# spring.datasource.url=jdbc:mysql://localhost:3307/message_service
spring.datasource.username=message_service
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka client config (if using service discovery)
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# eureka.instance.preferIpAddress=true

# Logging
logging.level.com.chat=DEBUG
