spring.application.name=friend-service

# spring.datasource.url=jdbc:mysql://127.0.0.1:3308/friend_service
# spring.datasource.url=jdbc:mysql://localhost:3308/friend_service
spring.datasource.url=jdbc:mysql://friend-db:3308/friend_service
spring.datasource.username=friend_service
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8082

# spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.friend=friend_service.queue
